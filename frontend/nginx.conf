server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # No version in error pages or the Server header: it tells a scanner which
    # CVEs to try and tells nobody else anything.
    server_tokens off;

    # The bundle is ~500 KB of JavaScript that compresses to a third of that.
    # `text/html` is always compressed once this is on; the rest are listed.
    # Not `text/event-stream`: compressing a stream buffers it, which is the
    # SSE failure the /api/ block below exists to prevent.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers, on every response from this server — and ONLY declared
    # here. nginx's `add_header` does not merge: a location with an
    # `add_header` of its own silently drops every one of these for the files
    # it serves, which is why /assets/ below caches with `expires` instead.
    #
    # The CSP is strict because the app lets it be: every script is a file
    # from this origin (the theme bootstrap included — see public/theme.js),
    # styles are one stylesheet, and the API is same-origin. `frame-ancestors`
    # does what X-Frame-Options does, for browsers that read the CSP.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS is deliberately not set here. It belongs to whatever terminates TLS
    # in front of this container, which is the only thing that knows the site
    # is HTTPS at all; sending it from plain HTTP is ignored at best.

    # Single-page app: every path that is not a real file is the app's own
    # route, so it gets index.html and the client decides what to render.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The built bundle calls /api on its own origin — exactly as it does in dev,
    # where Vite's dev server proxies it. Reproducing that here is the whole
    # point of putting nginx in front: one origin, no CORS, and no API URL
    # compiled into the JavaScript where it cannot be changed without a rebuild.
    location /api/ {
        # Through a variable, with Docker's embedded DNS, so `backend` is looked
        # up again rather than once. A literal `proxy_pass http://backend:8000`
        # is resolved when nginx starts and never again: redeploy only the
        # backend — `up -d --build backend`, the routine case — and it comes
        # back on a new IP while nginx keeps sending to the old one, a 502 on
        # every request until this container is restarted too. 127.0.0.11 is
        # the resolver inside any Compose network; on another orchestrator,
        # use its DNS address here instead.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        # No URI part, so the request's own URI is passed through unchanged —
        # the same as the literal form did.
        proxy_pass $backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The three lines that make Server-Sent Events work. Without them the
        # symptom is identical to streaming being broken: nginx buffers the
        # whole response and delivers it at once, or cuts the connection after
        # its default 60s read timeout mid-answer.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Hashed filenames, so these can never be stale. `expires` rather than an
    # `add_header Cache-Control` — see the note on the security headers above.
    location /assets/ {
        expires 1y;
    }
}
