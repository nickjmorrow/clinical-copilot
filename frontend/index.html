<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clinical Copilot</title>
    <meta
      name="description"
      content="Ask clinical questions about a synthetic hospital's patients in plain English. The model picks the hospital's defined terms; deterministic code writes the SQL, and every answer shows its working."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fcfcfc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1c20" media="(prefers-color-scheme: dark)" />
    <!-- The author's own mark, the same icons nickjmorrow.com serves. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Link previews (Slack, LinkedIn, iMessage…). Scrapers need absolute
         URLs, so these name the public demo; change them if you deploy
         somewhere else. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clinical Copilot" />
    <meta property="og:title" content="Clinical Copilot" />
    <meta
      property="og:description"
      content="Clinical questions in plain English — and the model never writes the SQL. A demo on synthetic patient data."
    />
    <meta property="og:url" content="https://204-168-227-216.sslip.io/" />
    <meta property="og:image" content="https://204-168-227-216.sslip.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Clinical Copilot answering an average-eGFR-by-age-band question with a bar chart."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Sets the theme before first paint. See public/theme.js for why it is a
         file and not an inline block. -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
